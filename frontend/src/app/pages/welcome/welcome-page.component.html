<div class="welcome">
  <p class="description">
    <span class="description__line">
      <span class="description__brand">brewski bets</span>
      lets you and your friends bet on
      <strong class="description__accent">anything</strong>.
    </span>
    <!-- Tags stay flush around the swooshed word: a line break anywhere between
    them would pad it with a space, and the stroke is sized to the word -->
    <!-- prettier-ignore -->
    <span class="description__line">
      But around here, the only currency is
      <span class="description__swoosh"><strong class="description__accent">beer</strong><svg
        class="description__swoosh-line"
        viewBox="0 -1.5 100 7"
        preserveAspectRatio="none"
        aria-hidden="true"><path
          d="M 0 3 C 18 1, 34 0, 50 0 L 78 0 C 90 0, 95 0.8, 100 2"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          vector-effect="non-scaling-stroke" /></svg></span>.
    </span>
  </p>

  <ea-stepper class="how-it-works">
    <ea-step label="Create a bet">
      <bb-create-bet-demo />
    </ea-step>

    <ea-step label="Set outcomes">
      <bb-outcomes-demo />
    </ea-step>

    <ea-step label="Track brewskis owed">
      <bb-standings-demo />
    </ea-step>
  </ea-stepper>

  <p class="auth-link cta">
    <a routerLink="/create-account">Create an account</a>
    to get started.
  </p>
</div>
