<footer class="footer">
  <div class="footer-top">
    <div class="footer-meta">
      <span class="copyright">&copy; {{ currentYear }} Brewski Bets</span>
      <span
        class="footer-separator"
        aria-hidden="true">
      </span>
      <span class="copyright">All rights reserved.</span>
    </div>

    <div class="footer-wordmark">
      <ea-eagami-wordmark
        variant="byline"
        layout="inline"
        [size]="13" />
    </div>

    <div class="footer-links">
      <a
        routerLink="/privacy-policy"
        class="footer-link">
        Privacy Policy
      </a>
      <span
        class="footer-dot"
        aria-hidden="true">
      </span>
      <a
        routerLink="/terms-of-service"
        class="footer-link">
        Terms of Service
      </a>
    </div>
  </div>
</footer>
